<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#00355f">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#00294a">
<meta name="color-scheme" content="light dark">
<title>Ubicato UCB</title>
<meta name="description" content="Encuentra tu evento en el campus UCB La Paz y llega por la ruta más corta.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ubicato"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300355f'/%3E%3Cpath d='M16 5a7 7 0 0 0-7 7c0 5 7 14 7 14s7-9 7-14a7 7 0 0 0-7-7z' fill='%23ffcd00'/%3E%3Ccircle cx='16' cy='12' r='2.6' fill='%2300355f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
/* Marca UCB: azul Pantone 541 y 312, amarillo Pantone 116, gris frío. Layout: encabezado azul con franja cian y amarilla, tarjetas al centro, barra inferior. */
--bg:#f2f5f9;--surface:#fff;--ink:#0a1f33;--muted:#53565a;--line:#dae2ec;--path:#b7c4d4;
--navy:#00355f;--blue:#005289;--cyan:#00a9ce;--sun:#ffcd00;
--brand:#00355f;--on-brand:#fff;--act:#00355f;--on-act:#fff;--route:#ffcd00;--on-route:#00355f;
--live:#0b8a5f;--soon:#b45309;--next:#005289;--ar-panel:rgba(0,28,50,.8);--ar-ink:#fff;
--shadow:0 1px 2px rgba(0,40,80,.06),0 10px 28px rgba(0,40,80,.07);
--f-d:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--f-b:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
--r:20px;--ease:cubic-bezier(.23,1,.32,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#061320;--surface:#0e2236;--ink:#e8eff6;--muted:#a3b3c4;--line:#1c3550;--path:#36506b;
--brand:#00294a;--act:#4cc3e3;--on-act:#00203a;--live:#3ecb96;--soon:#f3a44b;--next:#7fb5e6;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#061320;--surface:#0e2236;--ink:#e8eff6;--muted:#a3b3c4;--line:#1c3550;--path:#36506b;
--brand:#00294a;--act:#4cc3e3;--on-act:#00203a;--live:#3ecb96;--soon:#f3a44b;--next:#7fb5e6;--shadow:none}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-b);display:flex;justify-content:center}
.app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:560px){body{background:var(--line)}}
button,a,summary{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{border:0;background:none;cursor:pointer;font:inherit;color:inherit;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:48px}
input[type=checkbox]{width:24px;height:24px;min-height:0;padding:0;accent-color:var(--act);flex:none}
textarea{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:120px}
label{font:600 12.5px var(--f-d);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
h2{font:800 24px/1.12 var(--f-d);letter-spacing:-.015em;text-wrap:balance}
.muted{color:var(--muted);font-size:14.5px}.ok{color:var(--live);font-weight:600}.no,.warn{color:var(--soon);font-weight:600}
.eb{font:700 12px var(--f-d);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 150px}

.top{position:relative;background:linear-gradient(165deg,var(--brand),var(--blue));color:var(--on-brand);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 15px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--cyan) 0 62%,var(--sun) 62%)}
.brand b{display:flex;align-items:center;gap:8px;font:800 28px/1 var(--f-d);letter-spacing:-.02em}
.brand b svg{width:22px;height:26px;fill:var(--sun);flex:none}
.brand span{display:block;margin-top:3px;font:600 12px var(--f-d);letter-spacing:.09em;text-transform:uppercase;opacity:.75}
.tr{display:flex;align-items:center;gap:10px}.logo{height:44px;max-width:120px;object-fit:contain;background:#fff;border-radius:12px;padding:5px 8px}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.14);transition:transform .14s var(--ease)}
.ico:active{transform:scale(.94)}
.ico svg,.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.here{grid-column:1/-1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.24);color:#fff;border-radius:16px;padding:9px 14px;text-align:left;min-height:52px;transition:transform .14s var(--ease)}
.here:active{transform:scale(.985)}
.here span{font:700 11px var(--f-d);text-transform:uppercase;letter-spacing:.1em;flex:none;color:#7fd6ea}
.here b{flex:1;font:700 18px/1.15 var(--f-d);min-width:0;overflow-wrap:anywhere}
.here i{font:600 14px var(--f-d);font-style:normal;color:var(--sun);flex:none;text-decoration:underline;text-underline-offset:3px}
.demo{background:var(--surface);border-bottom:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:6px 16px}
.demo b{color:var(--soon)}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{position:relative;display:grid;justify-items:center;gap:2px;padding:9px 4px 7px;font:600 12px var(--f-d);letter-spacing:.03em;color:var(--muted);min-height:60px}
.tabs button[aria-current=page]{color:var(--act)}
.tabs button[aria-current=page]::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 4px 4px;background:var(--sun)}
.tabs button:active svg{transform:scale(.9)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:14px;background:var(--route);color:var(--on-route);font:700 16.5px var(--f-d);transition:transform .14s var(--ease),filter .14s;text-align:center}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn.sec{background:transparent;color:var(--act);box-shadow:inset 0 0 0 1.5px var(--path)}
.btn.sm{min-height:44px;padding:6px 14px;font-size:14.5px;flex:none}
.btn span{font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}

.s-live{--st:var(--live)}.s-soon{--st:var(--soon)}.s-next{--st:var(--next)}.s-fin{--st:var(--muted)}
.hero{display:grid;gap:4px}.hero h2{font-size:27px}
.tip{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px;box-shadow:inset 0 3px 0 var(--cyan),var(--shadow);font-size:15px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:10px 2px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);font:600 12.5px var(--f-d);color:var(--muted);display:grid;justify-items:center;min-height:72px;align-content:center;gap:2px}
.seg b{font:800 26px/1 var(--f-d);color:var(--st);font-variant-numeric:tabular-nums}
.seg button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--st),var(--shadow);color:var(--ink)}
.list{display:grid;gap:14px}
.ev{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:6px;box-shadow:var(--shadow)}
.ev-h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font:700 12px var(--f-d);letter-spacing:.07em;text-transform:uppercase;color:var(--st);display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.05);background:color-mix(in srgb,var(--st) 13%,transparent)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st)}
.s-live .pill::before,.ring{animation:pulso 1.8s ease-in-out infinite}
.ev h3{font:700 21px/1.15 var(--f-d);letter-spacing:-.01em;text-wrap:balance;margin-top:2px}
.ev-l{font-size:14.5px;color:var(--muted)}.ev-d{font-size:14.5px}
.ev-u{font:700 15px var(--f-d);color:var(--st)}
.acts{display:flex;gap:8px;margin-top:8px}.acts .btn:first-child{flex:1}
.empty{background:var(--surface);border-radius:var(--r);padding:18px 16px;color:var(--muted);box-shadow:var(--shadow)}
@keyframes pulso{50%{opacity:.35}}
@keyframes sube{from{transform:translate(-50%,24px);opacity:0}}

.view.map{padding:0;gap:0;overflow:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 15px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font:600 14px var(--f-d);color:var(--muted);min-height:40px}
.chips button[aria-pressed=true]{background:var(--act);color:var(--on-act);box-shadow:none}
svg.map{display:block;width:100%;font-family:var(--f-b)}
#map{flex:1;min-height:0;touch-action:none;cursor:grab}
.zoom{position:absolute;right:12px;bottom:52px;display:grid;gap:8px}
.zoom button{width:46px;height:46px;border-radius:14px;background:var(--surface);box-shadow:0 2px 8px rgba(0,30,60,.22);font:700 22px/1 var(--f-d)}
.zoom button:active{transform:scale(.94)}
.leg{flex:none;padding:9px 16px;font-size:12.5px;color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap;align-items:center;background:var(--surface);border-top:1px solid var(--line)}
.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2.5px solid;margin-right:5px;vertical-align:-1px}
.leg .l1{border-color:var(--live)}.leg .l2{border-color:var(--soon)}.leg .l3{border:0;border-top:2.5px dotted var(--muted);border-radius:0;width:18px;height:0;vertical-align:3px}
.cam{stroke:var(--path);stroke-linecap:round}.cam.esc{stroke:var(--muted)}
.rtc,.rt{fill:none;stroke-linecap:round;stroke-linejoin:round}.rtc{stroke:var(--brand)}.rt{stroke:var(--route)}
.hit{fill:transparent}
.pt .dot{fill:var(--surface);stroke:var(--act)}.pt .sig{fill:var(--act)}
.pt.t-servicio .dot{fill:var(--cyan);stroke:var(--cyan)}.pt.t-servicio .sig{fill:#00263f}
.pt.t-espacio .dot{fill:var(--act);stroke:var(--act)}.pt.t-espacio .sig{fill:var(--on-act)}
.pt.t-paso .dot{fill:var(--bg);stroke:var(--muted)}.pt.t-paso .sig{fill:var(--muted)}
.sig{font-family:var(--f-d);font-weight:800;text-anchor:middle;pointer-events:none}
.lab,.yo-t{text-anchor:middle;fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-linejoin:round;pointer-events:none}
.yo-t{font-family:var(--f-d);font-weight:800;letter-spacing:.04em}
.pt.off{opacity:.22}
.ring{fill:none}.ring.live{stroke:var(--live)}.ring.soon{stroke:var(--soon)}
.yo-c{fill:none;stroke:var(--brand)}.yo{fill:none;stroke:var(--route)}.yo.m{fill:var(--route);stroke:var(--brand)}
.cone{fill:var(--route);opacity:.5}

.scrim{position:fixed;inset:0;background:rgba(0,20,40,.55);z-index:20}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;max-height:84%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:26px 26px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;flex-direction:column;gap:14px;animation:sube .24s var(--ease);outline:0}
.sh-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet .ico{background:var(--bg);color:var(--ink);font:500 26px/1 var(--f-b);flex:none}
.mini-ev{list-style:none;padding:0;display:grid;gap:10px}
.mini-ev li{border-radius:14px;background:var(--bg);padding:10px 12px;font-size:15px}
.mini-ev small{display:block;color:var(--st);font-size:13.5px;font-weight:600}
.pick{display:grid;gap:6px}
.pick button{display:flex;align-items:center;gap:12px;text-align:left;padding:8px 10px;border-radius:14px;min-height:50px;box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.pick button[aria-current=true]{box-shadow:inset 0 0 0 2px var(--sun)}
.pick button:active{background:var(--bg)}
.pick i{font:800 13px var(--f-d);font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--act);color:var(--on-act);flex:none}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);max-width:min(92%,480px);background:var(--navy);color:#fff;padding:11px 16px;border-radius:14px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:30;box-shadow:0 8px 24px rgba(0,20,40,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.od{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.swt{grid-column:1/-1;display:flex;align-items:center;gap:10px;font:600 16px var(--f-b);letter-spacing:0;text-transform:none;color:var(--ink);min-height:44px}
.sum{display:flex;gap:6px 18px;align-items:baseline;flex-wrap:wrap}
.sum b{font:800 44px/1 var(--f-d);letter-spacing:-.02em;font-variant-numeric:tabular-nums}.sum small{font-size:15px;color:var(--muted)}
#rmap{height:260px;background:var(--surface);border-radius:var(--r);flex:none;box-shadow:var(--shadow)}
.steps{list-style:none;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--act);color:var(--on-act);display:grid;place-items:center;font:800 14px var(--f-d)}
.steps li.fin::before{content:"";background:var(--route);box-shadow:inset 0 0 0 7px var(--act)}
.steps small{display:block;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}

.view.ar{padding:0;overflow:hidden;background:#00203a;color:var(--ar-ink);touch-action:none;display:block}
.ar video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ar .sim{position:absolute;inset:0;background:linear-gradient(#10365a 0,#3d6a93 46.8%,#a4bbd2 47%,#12283d 47.4%,#061320 100%)}
.ar.cam-on .sim{display:none}
.strip{position:absolute;top:0;left:0;right:0;height:32px;background:var(--ar-panel);overflow:hidden}
.strip span{position:absolute;top:7px;transform:translateX(-50%);font:800 14px var(--f-d);letter-spacing:.1em}
.strip::after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:8px;background:var(--sun)}
.hud{position:absolute;top:42px;left:12px;right:12px;background:var(--ar-panel);border-radius:18px;padding:11px 15px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hud p{font-size:13.5px;opacity:.88;font-variant-numeric:tabular-nums}.hud h2{font-size:25px}
.lb{position:absolute;transform:translateX(-50%);background:var(--ar-panel);border-radius:12px;padding:6px 10px;font-size:13.5px;font-weight:600;white-space:nowrap;border:1px solid rgba(255,255,255,.3);font-variant-numeric:tabular-nums}
.lb.dest{border-color:var(--sun);color:var(--sun)}
.lb em{font:800 11px var(--f-d);font-style:normal;letter-spacing:.07em;text-transform:uppercase;margin-left:7px;padding:1px 6px;border-radius:99px;background:#3ecb96;color:#04261a}
.lb em.soon{background:#f3a44b;color:#2b1500}
.arrow{position:absolute;left:50%;top:66%;width:300px;height:300px;margin:-150px 0 0 -150px;will-change:transform;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.arrow svg{width:100%;height:100%;overflow:visible}
.arrow .ch{fill:var(--sun);stroke:#00355f;stroke-width:4;stroke-linejoin:round;opacity:.25;animation:fluye 1.5s ease-in-out infinite}
.arrow .c1{animation-delay:0s}.arrow .c2{animation-delay:.22s}.arrow .c3{animation-delay:.44s}
.arrow .rg{fill:rgba(255,205,0,.18);stroke:var(--sun);stroke-width:3}
.arrow .rg2{fill:none;stroke:#fff;stroke-width:2;opacity:.6;animation:onda 1.5s ease-out infinite;transform-origin:80px 80px}
.arrow.ok .ch{fill:#3ecb96}.arrow.ok .rg{stroke:#3ecb96;fill:rgba(62,203,150,.2)}
@keyframes fluye{0%{opacity:.2}30%{opacity:1}65%,100%{opacity:.2}}
@keyframes onda{from{transform:scale(.7);opacity:.7}to{transform:scale(1.5);opacity:0}}
.turn{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:5px 12px;border-radius:99px;background:var(--sun);color:#00355f;font:800 15px var(--f-d)}
.turn.ok{background:#3ecb96;color:#04261a}
.edge{position:absolute;top:44%;width:64px;height:92px;display:grid;place-items:center;font:800 40px var(--f-d);color:var(--sun);background:linear-gradient(90deg,rgba(0,28,50,.75),transparent);animation:pulso 1s ease-in-out infinite;pointer-events:none}
.edge.l{left:0}.edge.r{right:0;transform:scaleX(-1)}
.edge b{transform:none}
.lb.dest::before{content:"";display:block;width:2px;height:26px;background:var(--sun);margin:-34px auto 6px}
.lb.dest{font-size:15px;padding:7px 12px;box-shadow:0 0 0 3px rgba(255,205,0,.35)}
svg.mini{position:absolute;left:12px;bottom:76px;width:118px;height:118px;border-radius:18px;background:var(--bg);box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.ar-hint{position:absolute;left:142px;right:12px;bottom:80px;font-size:13.5px;background:var(--ar-panel);border-radius:12px;padding:8px 10px}
.ar-bar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px}
.ar-bar .btn{flex:1;padding:8px 10px;font-size:15.5px}
.ar-bar .btn.sec{background:var(--ar-panel);color:var(--ar-ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}

.adm details{background:var(--surface);border-radius:var(--r);padding:0 16px;box-shadow:var(--shadow)}
.adm summary{font:700 18px var(--f-d);padding:15px 0;cursor:pointer;min-height:50px}
.adm details>*:not(summary){margin-bottom:12px}
.adm form{display:grid;gap:8px}
.adm-l{list-style:none;padding:0;display:grid;gap:8px}
.adm-l li{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}
.adm-l div{min-width:0}.adm-l small{display:block;color:var(--muted);font-size:13px}
code{font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);overflow-wrap:anywhere;display:block;-webkit-user-select:all;user-select:all}
@media (hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.06)}.pick button:hover{background:var(--bg)}.chips button:hover{filter:brightness(.96)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- v4 visual ---- */
body{background:radial-gradient(900px 420px at 50% -120px,rgba(0,169,206,.16),transparent 70%),var(--bg)}
.top{background:radial-gradient(260px 180px at 92% -30px,rgba(0,169,206,.55),transparent 70%),radial-gradient(200px 160px at 8% 120%,rgba(255,205,0,.22),transparent 70%),linear-gradient(165deg,#00294a,#005289);padding-bottom:17px;border-radius:0 0 28px 28px;box-shadow:0 10px 30px rgba(0,40,80,.28);z-index:2}
.top::after{left:28px;right:28px;border-radius:3px 3px 0 0}

function arHud(){if(!$('#ar'))return;const nx=R?.ids[1],k=$('#arK'),to=$('#arTo'),inf=$('#arInfo'),b=$('#arNx');b.hidden=!nx;$('#calB').hidden=!(S.compOK&&nx);
 if(!S.destino){k.textContent='Sin destino';to.textContent='Mira a tu alrededor';inf.textContent='Gira para ver qué hay cerca. Elige un evento para recibir la flecha.'}
 else if(!R){k.textContent='Destino: '+PT[S.destino].nombre;to.textContent='Sin ruta sin gradas';inf.textContent='Desmarca Evitar escaleras en Ruta.'}
 else if(!nx){k.textContent='Llegaste';to.textContent=PT[S.destino].nombre;inf.textContent='Estás en el lugar del evento.'}
 else{k.textContent='Destino: '+PT[S.destino].nombre;to.textContent='Hacia '+PT[nx].nombre;inf.textContent=fm(R)+' restantes';b.textContent='Llegué a '+(PT[nx].corto||PT[nx].nombre)}
 const h=S.compOK?(nx?'Si la flecha no coincide, apunta al destino y toca Calibrar.':''):(S.stream?'Sin brújula: arrastra para girar la vista.':'Modo simulación: arrastra para girar la vista.'),H=$('#arHint');H.textContent=h;H.hidden=!h;$('#arOnB').hidden=!!S.stream||S.compOK}
function arFrame(){if(S.view!=='camara'||!$('#ar'))return;
 if(S.arDirty){S.arDirty=false;const p=yo(),H=S.heading,rel=b=>((b-H+540)%360)-180,nx=R?.ids[1]?PT[R.ids[1]]:null,ar=$('#arrow'),evp=evAhora(),[ux,uy]=PR.xy(p.lat,p.lng);
  ar.hidden=!nx;const rr=nx?rel(brg(p,nx)):0,ok=nx&&Math.abs(rr)<14,tn=$('#arTurn');if(nx)ar.style.transform=`perspective(520px) rotateX(58deg) rotate(${rr.toFixed(1)}deg)`;ar.classList.toggle('ok',!!ok);tn.hidden=!nx;if(nx){tn.classList.toggle('ok',!!ok);tn.textContent=ok?'Sigue de frente':(rr>0?'Gira a la derecha ':'Gira a la izquierda ')+Math.round(Math.abs(rr))+'°'}$('#edgeL').hidden=!(nx&&rr<-40);$('#edgeR').hidden=!(nx&&rr>40);
  $('#strip').innerHTML=CARD.map((c,i)=>{const r=rel(i*45);return Math.abs(r)<38?`<span style="left:${(50+r*1.44).toFixed(1)}%">${c}</span>`:''}).join('');
  $('#labs').innerHTML=D.puntos.filter(q=>q.tipo!=='paso'&&q.id!==S.origen).map(q=>({q,d:hav(p,q),r:rel(brg(p,q))})).filter(x=>Math.abs(x.r)<32&&x.d>3).sort((a,b)=>a.d-b.d).slice(0,4).map((x,i)=>`<span class="lb${x.q.id===S.destino?' dest':''}" style="left:${Math.min(84,Math.max(16,50+x.r*1.44)).toFixed(1)}%;top:${186+i*38}px">${esc(x.q.corto||x.q.nombre)} · ${Math.round(x.d)} m${evp[x.q.id]?`<em class="${evp[x.q.id]}">${evp[x.q.id]==='soon'?'por terminar':'en curso'}</em>`:''}</span>`).join('');
  mapa($('#mini'),{x:ux-55,y:uy-55,w:110,h:110},{mini:true,pos:p,heading:H})}
 requestAnimationFrame(arFrame)}

async function copia(txt,ok){try{await navigator.clipboard.writeText(txt);toast(ok)}catch(e){const t=$('#json');if(t){S.adm='json';t.closest('details').open=true;t.value=txt;t.focus();t.select();toast('Texto listo en el cuadro de datos: cópialo desde ahí.')}}}
const A={
share:async b=>{const e=D.eventos.find(x=>x.id===b.dataset.id);if(!e)return;const p=PT[e.punto],u=location.href.split('#')[0]+'#ir-'+e.punto,t0=`${e.nombre} · ${p?p.nombre:''} · ${cuando(e)}.`;try{if(navigator.share){await navigator.share({title:e.nombre,text:t0+' Ruta en Ubicato:',url:u});return}}catch(x){if(x&&x.name==='AbortError')return}window.open('https://wa.me/?text='+encodeURIComponent(t0+' Cómo llegar: '+u),'_blank','noopener')},
calib:()=>{const n=R?.ids[1];if(!S.compOK||!n)return toast('Activa la cámara y elige un destino primero.');S.off=(brg(yo(),PT[n])-S.raw+360)%360;S.heading=(S.raw+S.off)%360;store.set('.o',S.off);S.arDirty=true;toast('Dirección calibrada.')},
instalar:async()=>{if(S.inst){S.inst.prompt();try{await S.inst.userChoice}catch(x){}S.inst=null;store.set('.i',1);render(true)}else hoja(cab('Instalar en iPhone','Agregar a inicio')+'<ol class="steps"><li>Abre esta página en <b>Safari</b>.</li><li>Toca el botón Compartir (el cuadrado con flecha).</li><li>Elige <b>Agregar a pantalla de inicio</b>.</li></ol><button class="btn" data-act="cerrar">Entendido</button>')},
instOff:()=>{store.set('.i',1);render(true)},
tipOff:()=>{store.set('.t',1);render(true)},
go:b=>go(b.dataset.v),tab:b=>{S.tab=b.dataset.t;render(true)},cerrar:cierra,
ir:b=>{S.destino=b.dataset.id;calc();cierra();go('ruta')},aqui:b=>{origen(b.dataset.id,'manual');if(S.destino===b.dataset.id)llegada(b.dataset.id)},
origen:()=>hoja(cab('Punto de partida','¿Dónde estás?')+'<p class="muted">Escanea el QR del lugar o elige el punto más cercano.</p><button class="btn sec" data-act="gps">Usar mi GPS (al aire libre)</button><div class="pick">'+D.puntos.filter(p=>p.tipo!=='paso'||p.id===S.origen).map(p=>`<button data-act="aqui" data-id="${esc(p.id)}"${p.id===S.origen?' aria-current="true"':''}><i>${esc(p.sig||'')}</i>${esc(p.nombre)}</button>`).join('')+'</div>'),
gps:()=>{S.modo='gps';S.gpsVisto=false;cierra();toast('Buscando tu ubicación…');gpsOn()},
filtro:b=>{S.filtro=b.dataset.f;document.querySelectorAll('.chips button').forEach(c=>c.setAttribute('aria-pressed',c===b));dibuja()},
zin:()=>zoom(.7),zout:()=>zoom(1.4),zfit:()=>{V=null;dibuja()},
arOn:()=>{const DO=window.DeviceOrientationEvent,pO=DO?.requestPermission?DO.requestPermission().catch(()=>'no'):Promise.resolve(DO?'granted':'no'),pC=navigator.mediaDevices?.getUserMedia?navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).catch(()=>null):Promise.resolve(null);
 Promise.all([pO,pC]).then(async([o,st])=>{const v=$('#cam');if(o==='granted'){addEventListener('deviceorientationabsolute',onOri);addEventListener('deviceorientation',onOri)}
  if(st&&v&&S.view==='camara'){S.stream=st;v.srcObject=st;try{await v.play()}catch(e){}$('#ar').classList.add('cam-on')}else if(st)st.getTracks().forEach(t=>t.stop());
  arHud();setTimeout(()=>{if(S.view!=='camara')return;if(!S.stream&&!S.compOK)toast('Aquí no hay acceso a cámara ni brújula. Sigue en simulación o abre la app publicada desde tu celular.');else if(!S.stream)toast('Sin permiso de cámara. La flecha funciona igual.');else if(!S.compOK)toast('Este equipo no tiene brújula: arrastra para girar.');arHud()},1500)})},
arNext:()=>{if(!R?.ids[1])return;S.modo='manual';S.origen=R.ids[1];store.set('.p',{o:S.origen,a:S.acc});calc();const fin=R&&R.ids.length<2;if(!fin&&!S.compOK&&R?.ids[1])S.heading=(brg(yo(),PT[R.ids[1]])+332)%360;render();if(fin)llegada(S.destino)},
calGps:()=>{if(!navigator.geolocation)return toast('Este dispositivo no entrega ubicación.');toast('Leyendo GPS…');navigator.geolocation.getCurrentPosition(p=>{const i=$('#calLL');if(i){i.value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);toast('Coordenadas leídas (±'+Math.round(p.coords.accuracy)+' m). Revisa y guarda.')}},()=>toast('No se pudo leer el GPS. Pega las coordenadas desde Google Maps.'),{enableHighAccuracy:true,timeout:15000})},
evDel:b=>{D.eventos=D.eventos.filter(e=>e.id!==b.dataset.id);S.adm='ev';guarda();toast('Evento quitado.')},
qr:b=>copia(location.href.split('#')[0]+'#desde-'+b.dataset.id,'Enlace copiado.'),
jsonCopy:()=>{const{centro,radio,...d}=D,t=JSON.stringify(d,null,1);$('#json').value=t;copia(t,'Datos copiados.')},
jsonLoad:()=>{let d;try{d=JSON.parse($('#json').value)}catch(e){return toast('El texto no es un JSON válido. Revisa comas y llaves.')}if(!valido(d))return toast('Faltan puntos, caminos o eventos en los datos.');D=d;S.adm='json';guarda();toast('Datos cargados.')},
reset:()=>{store.del('.d');D=ejemplo();S.destino=null;index();render(true);toast('Datos de ejemplo restaurados.')},
noDemo:()=>{D.ejemplo=false;S.adm='json';guarda()}};

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){A[b.dataset.act]?.(b);return}if(e.target.id==='scrim')cierra()});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='selO')origen(t.value,'manual');else if(t.id==='selD'){S.destino=t.value||null;calc();render(true)}else if(t.id==='acc'){S.acc=t.checked;store.set('.p',{o:S.origen,a:S.acc});calc();render(true)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.id;
 if(f==='fCal'){const m=$('#calLL').value.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*$/),p=PT[$('#calP').value];if(!m||Math.abs(m[1])>90||Math.abs(m[2])>180)return toast('Escribe latitud y longitud separadas por coma, por ejemplo -16.5229, -68.1121');p.lat=+m[1];p.lng=+m[2];S.adm='cal';const id=p.id;guarda();$('#calP').value=id;toast('Guardado: '+p.nombre+'. Las distancias se recalcularon.')}
 if(f==='fEv'){const i=new Date($('#evI').value),fi=new Date($('#evF').value);if(isNaN(i)||isNaN(fi)||fi<=i)return toast('La hora de término debe ser posterior a la de inicio.');D.eventos.push({id:'e'+Date.now().toString(36),nombre:$('#evN').value.trim(),punto:$('#evP').value,inicio:i.toISOString(),fin:fi.toISOString(),desc:$('#evD').value.trim()});S.adm='ev';guarda();toast('Evento agregado.')}});
document.addEventListener('toggle',e=>{if(e.target.open&&e.target.dataset?.k)S.adm=e.target.dataset.k},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')cierra();if(S.view==='camara'&&!S.compOK&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){S.heading=(S.heading+(e.key==='ArrowLeft'?-8:8)+360)%360;S.arDirty=true}});
addEventListener('hashchange',ruteo);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.inst=e;if(S.view==='eventos')render(true)});addEventListener('appinstalled',()=>{S.inst=null;store.set('.i',1)});
if('serviceWorker' in navigator&&/^https:|^http:\/\/localhost/.test(location.protocol+'//'+location.host))navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('resize',()=>{if(S.view==='mapa'){V=null;dibuja()}});
setInterval(()=>{if(S.view==='eventos'&&$('#sheet').hidden)render();else if(S.view==='mapa')dibuja()},30000);

const g=store.get('.d'),pf=store.get('.p'),po=store.get('.o');if(typeof po==='number')S.off=po;D=valido(g)?g:ejemplo();if(pf){S.origen=pf.o;S.acc=!!pf.a}index();ruteo();
if(!valido(g))fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(valido(d)){D=d;index();render(true)}}).catch(()=>{});
})();
