<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b3a82">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12294d">
<meta name="color-scheme" content="light dark">
<title>Ubicato UCB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
/* Layout: una columna de teléfono. Cabecera con la franja amarilla "Estás en" (señalética), vista al centro, pestañas abajo. */
--bg:#edf0f5;--surface:#fff;--ink:#0e1b2e;--muted:#566780;--line:#d3dae5;--path:#b7c2d3;
--brand:#0b3a82;--on-brand:#fff;--act:#0b3a82;--on-act:#fff;--route:#f5b800;--on-route:#1a1300;
--live:#0f7a55;--soon:#b3530a;--next:#3355c4;--ar-panel:rgba(8,16,30,.74);--ar-ink:#fff;
--f-d:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;--f-b:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
--r:14px;--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#0a121f;--surface:#141f31;--ink:#e9eef6;--muted:#94a4bb;--line:#26354b;--path:#3a4c68;
--brand:#12294d;--on-brand:#eaf1ff;--act:#8ab4ff;--on-act:#06172e;--route:#ffc933;--live:#3ecb96;--soon:#f3a44b;--next:#8fa9ff}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0a121f;--surface:#141f31;--ink:#e9eef6;--muted:#94a4bb;--line:#26354b;--path:#3a4c68;
--brand:#12294d;--on-brand:#eaf1ff;--act:#8ab4ff;--on-act:#06172e;--route:#ffc933;--live:#3ecb96;--soon:#f3a44b;--next:#8fa9ff}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-b);display:flex;justify-content:center}
.app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:560px){body{background:var(--line)}}
button,a,summary{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{border:0;background:none;cursor:pointer;font:inherit;color:inherit;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:46px}
input[type=checkbox]{width:24px;height:24px;min-height:0;padding:0;accent-color:var(--act);flex:none}
textarea{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:120px}
label{font:600 13px var(--f-d);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--route);outline-offset:2px}
h2{font:700 24px/1.15 var(--f-d);text-wrap:balance}
.muted{color:var(--muted);font-size:14.5px}.ok{color:var(--live);font-weight:600}.no,.warn{color:var(--soon);font-weight:600}
.eb{font:600 12px var(--f-d);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 150px}

.top{background:var(--brand);color:var(--on-brand);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px;display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.brand b{font:700 27px/1 var(--f-d);display:block}
.brand span{font-size:12px;opacity:.8;letter-spacing:.07em;text-transform:uppercase}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.13);transition:transform .12s var(--ease)}
.ico:active{transform:scale(.94)}
.ico svg,.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.here{grid-column:1/-1;display:flex;align-items:center;gap:10px;background:var(--route);color:var(--on-route);border-radius:12px;padding:8px 12px;text-align:left;min-height:48px;transition:transform .12s var(--ease)}
.here:active{transform:scale(.985)}
.here span{font:600 12px var(--f-d);text-transform:uppercase;letter-spacing:.08em;flex:none}
.here b{flex:1;font:700 19px/1.1 var(--f-d);min-width:0;overflow-wrap:anywhere}
.here i{font-style:normal;font-size:13px;text-decoration:underline;flex:none}
.demo{background:var(--surface);border-bottom:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:6px 16px}
.demo b{color:var(--soon)}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{display:grid;justify-items:center;gap:2px;padding:8px 4px 7px;font:600 12.5px var(--f-d);letter-spacing:.03em;color:var(--muted);min-height:58px}
.tabs button[aria-current=page]{color:var(--act)}
.tabs button:active svg{transform:scale(.9)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;background:var(--act);color:var(--on-act);font:600 16.5px var(--f-d);letter-spacing:.02em;transition:transform .12s var(--ease),filter .12s;text-align:center}
.btn:active{transform:scale(.97);filter:brightness(.9)}
.btn.sec{background:transparent;color:var(--act);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14.5px;flex:none}
.btn span{font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}

.s-live{--st:var(--live)}.s-soon{--st:var(--soon)}.s-next{--st:var(--next)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:8px 6px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font:600 14px var(--f-d);color:var(--muted);display:grid;justify-items:center;min-height:58px;align-content:center}
.seg b{font:700 22px/1 var(--f-d);color:var(--st);font-variant-numeric:tabular-nums}
.seg button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--st);color:var(--ink)}
.list{display:grid;gap:12px}
.ev{background:var(--surface);border-radius:var(--r);border-left:5px solid var(--st);padding:14px 14px 14px 13px;display:grid;gap:5px}
.ev-h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font:700 12px var(--f-d);letter-spacing:.08em;text-transform:uppercase;color:var(--st);display:inline-flex;align-items:center;gap:6px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st)}
.s-live .pill::before,.ring{animation:pulso 1.8s ease-in-out infinite}
.ev h3{font:700 21px/1.15 var(--f-d);text-wrap:balance}
.ev-l{font-size:14.5px;color:var(--muted)}.ev-d{font-size:14.5px}
.ev .btn{margin-top:7px}
.empty{background:var(--surface);border-radius:var(--r);padding:18px 16px;color:var(--muted)}
@keyframes pulso{50%{opacity:.35}}
@keyframes sube{from{transform:translate(-50%,24px);opacity:0}}

.view.map{padding:0;gap:0;overflow:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 13px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font:600 14px var(--f-d);color:var(--muted);min-height:38px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);box-shadow:none}
svg.map{display:block;width:100%;font-family:var(--f-b)}
#map{flex:1;min-height:0;touch-action:none;cursor:grab}
.zoom{position:absolute;right:12px;bottom:52px;display:grid;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.18),inset 0 0 0 1px var(--line);font:700 22px/1 var(--f-d)}
.zoom button:active{transform:scale(.94)}
.leg{flex:none;padding:8px 16px;font-size:12.5px;color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap;align-items:center;background:var(--surface);border-top:1px solid var(--line)}
.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2.5px solid;margin-right:5px;vertical-align:-1px}
.leg .l1{border-color:var(--live)}.leg .l2{border-color:var(--soon)}.leg .l3{border:0;border-top:2.5px dotted var(--muted);border-radius:0;width:18px;height:0;vertical-align:3px}
.cam{stroke:var(--path);stroke-linecap:round}.cam.esc{stroke:var(--muted)}
.rtc,.rt{fill:none;stroke-linecap:round;stroke-linejoin:round}.rtc{stroke:var(--ink)}.rt{stroke:var(--route)}
.hit{fill:transparent}
.pt .dot{fill:var(--surface);stroke:var(--ink)}.pt .sig{fill:var(--ink)}
.pt.t-servicio .dot{fill:var(--ink)}.pt.t-servicio .sig{fill:var(--bg)}
.pt.t-espacio .dot{fill:var(--act);stroke:var(--act)}.pt.t-espacio .sig{fill:var(--on-act)}
.pt.t-paso .dot{fill:var(--bg);stroke:var(--muted)}.pt.t-paso .sig{fill:var(--muted)}
.sig{font-family:var(--f-d);font-weight:700;text-anchor:middle;pointer-events:none}
.lab,.yo-t{text-anchor:middle;fill:var(--ink);font-weight:500;paint-order:stroke;stroke:var(--bg);stroke-linejoin:round;pointer-events:none}
.yo-t{font-family:var(--f-d);font-weight:700;letter-spacing:.04em}
.pt.off{opacity:.22}
.ring{fill:none}.ring.live{stroke:var(--live)}.ring.soon{stroke:var(--soon)}
.yo-c{fill:none;stroke:var(--ink)}.yo{fill:none;stroke:var(--route)}.yo.m{fill:var(--route);stroke:var(--ink)}
.cone{fill:var(--route);opacity:.45}

.scrim{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:20}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;max-height:82%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;flex-direction:column;gap:12px;animation:sube .22s var(--ease);outline:0}
.sh-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet .ico{background:var(--bg);font:500 26px/1 var(--f-b);flex:none}
.mini-ev{list-style:none;padding:0;display:grid;gap:8px}
.mini-ev li{border-left:4px solid var(--st);padding-left:10px;font-size:15px}
.mini-ev small{display:block;color:var(--muted);font-size:13.5px}
.pick{display:grid;gap:6px}
.pick button{display:flex;align-items:center;gap:12px;text-align:left;padding:8px 10px;border-radius:12px;min-height:48px;box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.pick button[aria-current=true]{box-shadow:inset 0 0 0 2px var(--route)}
.pick button:active{background:var(--bg)}
.pick i{font:700 13px var(--f-d);font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--surface);flex:none}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);max-width:min(92%,480px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}

.od{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:14px}
.swt{grid-column:1/-1;display:flex;align-items:center;gap:10px;font:500 16px var(--f-b);letter-spacing:0;text-transform:none;color:var(--ink);min-height:44px}
.sum{display:flex;gap:6px 18px;align-items:baseline;flex-wrap:wrap}
.sum b{font:700 42px/1 var(--f-d);font-variant-numeric:tabular-nums}.sum small{font-size:15px;color:var(--muted)}
#rmap{height:260px;background:var(--surface);border-radius:var(--r);flex:none}
.steps{list-style:none;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 14px var(--f-d)}
.steps li.fin::before{content:"";background:var(--route);box-shadow:inset 0 0 0 6px var(--ink)}
.steps small{display:block;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}

.view.ar{padding:0;overflow:hidden;background:#0b1422;color:var(--ar-ink);touch-action:none;display:block}
.ar video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ar .sim{position:absolute;inset:0;background:linear-gradient(#1d2f4b 0,#40597c 46.8%,#9fb2cc 47%,#1a2638 47.4%,#0b131f 100%)}
.ar.cam-on .sim{display:none}
.strip{position:absolute;top:0;left:0;right:0;height:32px;background:var(--ar-panel);overflow:hidden}
.strip span{position:absolute;top:7px;transform:translateX(-50%);font:700 14px var(--f-d);letter-spacing:.1em}
.strip::after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:8px;background:var(--route)}
.hud{position:absolute;top:42px;left:12px;right:12px;background:var(--ar-panel);border-radius:14px;padding:10px 14px}
.hud p{font-size:13.5px;opacity:.85;font-variant-numeric:tabular-nums}.hud h2{font-size:25px}
.lb{position:absolute;transform:translateX(-50%);background:var(--ar-panel);border-radius:10px;padding:5px 9px;font-size:13.5px;white-space:nowrap;border:1px solid rgba(255,255,255,.28);font-variant-numeric:tabular-nums}
.lb.dest{border-color:var(--route);color:var(--route);font-weight:600}
.lb em{font:700 11px var(--f-d);font-style:normal;letter-spacing:.07em;text-transform:uppercase;margin-left:7px;padding:1px 6px;border-radius:99px;background:#3ecb96;color:#04261a}
.lb em.soon{background:#f3a44b;color:#2b1500}
.arrow{position:absolute;left:50%;top:60%;width:124px;height:174px;margin:-87px 0 0 -62px;will-change:transform;pointer-events:none}
.arrow svg{width:100%;height:100%;overflow:visible}
.arrow path{fill:var(--route);stroke:var(--on-route);stroke-width:3;stroke-linejoin:round}
svg.mini{position:absolute;left:12px;bottom:76px;width:118px;height:118px;border-radius:16px;background:var(--bg);box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.ar-hint{position:absolute;left:142px;right:12px;bottom:80px;font-size:13.5px;background:var(--ar-panel);border-radius:10px;padding:8px 10px}
.ar-bar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px}
.ar-bar .btn{flex:1;background:var(--route);color:var(--on-route);padding:8px 10px;font-size:15.5px}
.ar-bar .btn.sec{background:var(--ar-panel);color:var(--ar-ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}

.adm details{background:var(--surface);border-radius:var(--r);padding:0 14px}
.adm summary{font:700 18px var(--f-d);padding:14px 0;cursor:pointer;min-height:48px}
.adm details>*:not(summary){margin-bottom:12px}
.adm form{display:grid;gap:8px}
.adm-l{list-style:none;padding:0;display:grid;gap:8px}
.adm-l li{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}
.adm-l div{min-width:0}.adm-l small{display:block;color:var(--muted);font-size:13px}
code{font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);overflow-wrap:anywhere;display:block;-webkit-user-select:all;user-select:all}
@media (hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.08)}.pick button:hover,.chips button:hover{background:var(--bg)}.chips button[aria-pressed=true]:hover{background:var(--ink)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand"><b>Ubicato</b><span>Campus UCB · La Paz</span></div>
<button class="ico" data-act="go" data-v="ajustes" aria-label="Administrar datos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg></button>
<button class="here" data-act="origen"><span>Estás en</span><b id="hereN"></b><i>Cambiar</i></button>
</header>
<div class="demo" id="demo" hidden><b>Datos de ejemplo.</b> Bloques según el plano; posiciones y eventos por confirmar.</div>
<main id="main"></main>
<nav class="tabs" aria-label="Secciones">
<button data-act="go" data-v="eventos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4 10h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>Eventos</button>
<button data-act="go" data-v="mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Mapa</button>
<button data-act="go" data-v="ruta"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h5.5"/></svg>Ruta</button>
<button data-act="go" data-v="camara"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Cámara</button>
</nav>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s),LS='dondeucb2',rad=x=>x*Math.PI/180;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(LS+k))}catch(e){return null}},set(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(LS+k)}catch(e){}}};
const hav=(a,b)=>{const s=Math.sin(rad(b.lat-a.lat)/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(rad(b.lng-a.lng)/2)**2;return 12742000*Math.asin(Math.sqrt(s))};
const brg=(a,b)=>{const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat)),x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));return(Math.atan2(y,x)*180/Math.PI+360)%360};
const VEL=75,TIPO={entrada:'Entrada',bloque:'Bloque',servicio:'Servicio',espacio:'Espacio',paso:'Acceso'},RUMBO=['norte','noreste','este','sureste','sur','suroeste','oeste','noroeste'],CARD=['N','NE','E','SE','S','SO','O','NO'];
const fH=new Intl.DateTimeFormat('es-BO',{hour:'2-digit',minute:'2-digit',hour12:false}),fD=new Intl.DateTimeFormat('es-BO',{weekday:'short',day:'numeric',month:'short'});
let D,PT,ADJ,PR,V=null,R=null;
const S={view:'eventos',tab:'live',origen:null,destino:null,acc:false,filtro:'todo',modo:'manual',gps:null,gpsOK:false,watch:null,heading:0,compOK:false,stream:null,arDirty:true,adm:'cal'};

/* Campus UCB La Paz según el plano oficial. Posiciones del plano (px) convertidas a lat/lng con la escala del campus (~156 x 137 m, referencia OpenStreetMap). Aproximadas: afinar en Administrar datos. */
function ejemplo(){
 const W=-68.11255,N0=-16.52217,mx=106722,my=110540,g=(x,y)=>[+(N0-(y-55)*.559/my).toFixed(6),+(W+(x-160)*.557/mx).toFixed(6)],now=Date.now(),
 P=(id,nombre,corto,tipo,sig,x,y,o)=>{const[lat,lng]=g(x,y);return{id,nombre,corto,tipo,sig,lat,lng,...o}},

<details data-k="ev"${op('ev')}><summary>Eventos (${D.eventos.length})</summary><ul class="adm-l">${D.eventos.map(e=>`<li><div><b>${esc(e.nombre)}</b><small>${esc(PT[e.punto]?.nombre||'?')} · ${cuando(e)}</small></div><button class="btn sec sm" data-act="evDel" data-id="${esc(e.id)}">Quitar</button></li>`).join('')}</ul><form id="fEv"><label for="evN">Nombre del evento</label><input id="evN" required maxlength="80" autocomplete="off"><label for="evP">Lugar</label><select id="evP">${opt}</select><label for="evI">Empieza</label><input id="evI" type="datetime-local" required><label for="evF">Termina</label><input id="evF" type="datetime-local" required><label for="evD">Descripción (opcional)</label><input id="evD" maxlength="140" autocomplete="off"><button class="btn" type="submit">Agregar evento</button></form></details>
<details data-k="qr"${op('qr')}><summary>Enlaces para códigos QR</summary><p class="muted">Cada enlace abre la app con la ubicación ya fijada. Genera un QR por punto y pégalo en ese lugar. Usa los enlaces de la dirección final donde publiques la app.</p><ul class="adm-l">${D.puntos.filter(p=>p.tipo!=='paso').map(p=>`<li><div><b>${esc(p.nombre)}</b><code>${esc(base)}#desde-${esc(p.id)}</code></div><button class="btn sec sm" data-act="qr" data-id="${esc(p.id)}">Copiar</button></li>`).join('')}</ul></details>
<details data-k="json"${op('json')}><summary>Copiar o cargar datos</summary><label for="json">Datos en formato JSON</label><textarea id="json" spellcheck="false" autocapitalize="none" placeholder="Pega aquí los datos para cargarlos"></textarea><div class="row"><button class="btn" data-act="jsonCopy">Copiar datos actuales</button><button class="btn sec" data-act="jsonLoad">Cargar lo pegado</button></div><div class="row"><button class="btn sec" data-act="reset">Restaurar ejemplo</button>${D.ejemplo?'<button class="btn sec" data-act="noDemo">Quitar aviso de ejemplo</button>':''}</div></details></section>`}};

const POST={
mapa(){const sv=$('#map');gestos(sv);dibuja()},
ruta(){const sv=$('#rmap');if(sv&&R)mapa(sv,vista(sv,R.ids,40),{solo:R.ids})},
camara(){const ar=$('#ar');let last=null;
 ar.addEventListener('pointerdown',e=>{if(!e.target.closest('button'))last=e.clientX});
 ar.addEventListener('pointermove',e=>{if(last==null||S.compOK)return;S.heading=(S.heading-(e.clientX-last)*.35+360)%360;last=e.clientX;S.arDirty=true});
 ['pointerup','pointercancel','pointerleave'].forEach(t=>ar.addEventListener(t,()=>last=null));
 if(!S.compOK&&R?.ids[1])S.heading=(brg(yo(),PT[R.ids[1]])+332)%360;
 arHud();S.arDirty=true;requestAnimationFrame(arFrame)}};

function render(force){
 $('#hereN').textContent=PT[S.origen].nombre+(S.modo==='gps'&&S.gpsOK?' · GPS':'');$('#demo').hidden=!D.ejemplo;
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===S.view?'page':'false'));
 if(!force&&S.view==='camara'&&$('#ar')){arHud();S.arDirty=true;return}
 if(!force&&S.view==='mapa'&&$('#map')){dibuja();return}
 if(S.view!=='camara')camOff();
 const m=$('#main'),st=m.firstElementChild?.scrollTop||0;m.innerHTML=VIEWS[S.view]();if(!force&&m.firstElementChild)m.firstElementChild.scrollTop=st;POST[S.view]?.()}
function go(v){if(!VIEWS[v])return;S.view=v;try{if(location.hash!=='#'+v)location.hash=v}catch(e){}render(true)}
function ruteo(){const h=location.hash.slice(1);let m;
 if(m=h.match(/^desde-([A-Za-z0-9]+)$/)){if(PT[m[1]]){S.origen=m[1];S.modo='manual';calc();toast('Estás en '+PT[m[1]].nombre)}S.view='eventos'}
 else if(m=h.match(/^ir-([A-Za-z0-9]+)$/)){if(PT[m[1]]){S.destino=m[1];calc()}S.view='ruta'}
 else if(VIEWS[h]){if(h===S.view&&$('#main').firstElementChild)return;S.view=h}
 render(true)}
function origen(id,modo){S.origen=id;S.modo=modo;store.set('.p',{o:id,a:S.acc});calc();cierra();render(S.view!=='camara')}
function guarda(){store.set('.d',D);index();render(true)}

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),4200)}
function hoja(h){const s=$('#sheet');s.innerHTML=h;s.hidden=false;$('#scrim').hidden=false;s.scrollTop=0;s.focus()}
function cierra(){$('#sheet').hidden=true;$('#scrim').hidden=true}
const cab=(k,t)=>`<div class="sh-h"><div><p class="eb">${k}</p><h2>${t}</h2></div><button class="ico" data-act="cerrar" aria-label="Cerrar">×</button></div>`;
function punto(id){const p=PT[id];if(!p)return;const t=Date.now(),evs=D.eventos.map(e=>({e,s:est(e,t)})).filter(x=>x.e.punto===id&&x.s.k!=='fin'),ab=abierto(p),r=ruta(S.origen,id,S.acc);
 hoja(cab(esc(TIPO[p.tipo]||'Punto')+(p.piso?' · piso '+esc(p.piso):''),esc(p.nombre))+(ab?`<p class="${ab.ok?'ok':'no'}">${ab.txt}</p>`:'')+(p.info?`<p>${esc(p.info)}</p>`:'')+(evs.length?`<ul class="mini-ev">${evs.map(({e,s})=>`<li class="s-${s.k}"><b>${esc(e.nombre)}</b><small>${s.pill} · ${s.txt} · ${cuando(e)}</small></li>`).join('')}</ul>`:'<p class="muted">Sin eventos programados en este punto.</p>')+(id===S.origen?'<p class="muted">Este es tu punto de partida.</p>':`<div class="row"><button class="btn" data-act="ir" data-id="${esc(id)}">Cómo llegar <span>${r?fm(r):'sin ruta accesible'}</span></button><button class="btn sec" data-act="aqui" data-id="${esc(id)}">Estoy aquí</button></div>`))}

function gpsOn(){if(!navigator.geolocation){toast('Este dispositivo no entrega ubicación. Elige tu punto o escanea un QR.');S.modo='manual';return}if(S.watch!=null)return;
 try{S.watch=navigator.geolocation.watchPosition(p=>{S.gps={lat:p.coords.latitude,lng:p.coords.longitude};const d=hav(S.gps,D.centro)<D.radio;if(d!==S.gpsOK||!S.gpsVisto){S.gpsVisto=true;S.gpsOK=d;if(!d&&S.modo==='gps')toast('Tu GPS te ubica fuera del campus. Elige tu punto de partida.')}
   let ch=false;if(d&&S.modo==='gps'){const c=cerca(S.gps);if(c!==S.origen){S.origen=c;calc();ch=true}}S.arDirty=true;
   if(S.view==='mapa')dibuja();else if(S.view==='camara'||(ch&&S.view!=='ajustes'))render();else $('#hereN').textContent=PT[S.origen].nombre+(S.modo==='gps'&&S.gpsOK?' · GPS':'')},
  ()=>{if(S.modo==='gps')toast('No se pudo leer el GPS. Elige tu punto de partida o escanea un QR.');S.modo='manual';gpsOff()},{enableHighAccuracy:true,maximumAge:4000,timeout:15000})}catch(e){S.modo='manual'}}
function gpsOff(){if(S.watch!=null){try{navigator.geolocation.clearWatch(S.watch)}catch(e){}S.watch=null}}

/* Vista de cámara: flecha y etiquetas colocadas con rumbo (brújula) y posición; sin sensores queda en simulación arrastrable */
function onOri(e){let h=null;if(e.webkitCompassHeading!=null)h=e.webkitCompassHeading;else if(e.absolute&&e.alpha!=null)h=360-e.alpha;if(h==null||isNaN(h))return;if(!S.compOK){S.compOK=true;S.heading=h;arHud()}S.heading=(S.heading+(((h-S.heading+540)%360)-180)*.25+360)%360;S.arDirty=true}
function camOff(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}removeEventListener('deviceorientationabsolute',onOri);removeEventListener('deviceorientation',onOri);S.compOK=false}
function arHud(){if(!$('#ar'))return;const nx=R?.ids[1],k=$('#arK'),to=$('#arTo'),inf=$('#arInfo'),b=$('#arNx');b.hidden=!nx;
 if(!S.destino){k.textContent='Sin destino';to.textContent='Mira a tu alrededor';inf.textContent='Gira para ver qué hay cerca. Elige un evento para recibir la flecha.'}
 else if(!R){k.textContent='Destino: '+PT[S.destino].nombre;to.textContent='Sin ruta sin gradas';inf.textContent='Desmarca Evitar escaleras en Ruta.'}
 else if(!nx){k.textContent='Llegaste';to.textContent=PT[S.destino].nombre;inf.textContent='Estás en el lugar del evento.'}
 else{k.textContent='Destino: '+PT[S.destino].nombre;to.textContent='Hacia '+PT[nx].nombre;inf.textContent=fm(R)+' restantes';b.textContent='Llegué a '+(PT[nx].corto||PT[nx].nombre)}
 $('#arHint').hidden=S.compOK;$('#arHint').textContent=S.stream?'Sin brújula: arrastra para girar la vista.':'Modo simulación: arrastra para girar la vista.';$('#arOnB').hidden=!!S.stream||S.compOK}
function arFrame(){if(S.view!=='camara'||!$('#ar'))return;
 if(S.arDirty){S.arDirty=false;const p=yo(),H=S.heading,rel=b=>((b-H+540)%360)-180,nx=R?.ids[1]?PT[R.ids[1]]:null,ar=$('#arrow'),evp=evAhora(),[ux,uy]=PR.xy(p.lat,p.lng);
  ar.hidden=!nx;if(nx)ar.style.transform=`perspective(520px) rotateX(56deg) rotate(${rel(brg(p,nx)).toFixed(1)}deg)`;
  $('#strip').innerHTML=CARD.map((c,i)=>{const r=rel(i*45);return Math.abs(r)<38?`<span style="left:${(50+r*1.44).toFixed(1)}%">${c}</span>`:''}).join('');
  $('#labs').innerHTML=D.puntos.filter(q=>q.tipo!=='paso'&&q.id!==S.origen).map(q=>({q,d:hav(p,q),r:rel(brg(p,q))})).filter(x=>Math.abs(x.r)<32&&x.d>3).sort((a,b)=>a.d-b.d).slice(0,4).map((x,i)=>`<span class="lb${x.q.id===S.destino?' dest':''}" style="left:${Math.min(84,Math.max(16,50+x.r*1.44)).toFixed(1)}%;top:${150+i*40}px">${esc(x.q.corto||x.q.nombre)} · ${Math.round(x.d)} m${evp[x.q.id]?`<em class="${evp[x.q.id]}">${evp[x.q.id]==='soon'?'por terminar':'en curso'}</em>`:''}</span>`).join('');
  mapa($('#mini'),{x:ux-55,y:uy-55,w:110,h:110},{mini:true,pos:p,heading:H})}
 requestAnimationFrame(arFrame)}

async function copia(txt,ok){try{await navigator.clipboard.writeText(txt);toast(ok)}catch(e){const t=$('#json');if(t){S.adm='json';t.closest('details').open=true;t.value=txt;t.focus();t.select();toast('Texto listo en el cuadro de datos: cópialo desde ahí.')}}}
const A={
go:b=>go(b.dataset.v),tab:b=>{S.tab=b.dataset.t;render(true)},cerrar:cierra,
ir:b=>{S.destino=b.dataset.id;calc();cierra();go('ruta')},aqui:b=>origen(b.dataset.id,'manual'),
origen:()=>hoja(cab('Punto de partida','¿Dónde estás?')+'<p class="muted">Escanea el QR del lugar o elige el punto más cercano.</p><button class="btn sec" data-act="gps">Usar mi GPS (al aire libre)</button><div class="pick">'+D.puntos.filter(p=>p.tipo!=='paso'||p.id===S.origen).map(p=>`<button data-act="aqui" data-id="${esc(p.id)}"${p.id===S.origen?' aria-current="true"':''}><i>${esc(p.sig||'')}</i>${esc(p.nombre)}</button>`).join('')+'</div>'),
gps:()=>{S.modo='gps';S.gpsVisto=false;cierra();toast('Buscando tu ubicación…');gpsOn()},
filtro:b=>{S.filtro=b.dataset.f;document.querySelectorAll('.chips button').forEach(c=>c.setAttribute('aria-pressed',c===b));dibuja()},
zin:()=>zoom(.7),zout:()=>zoom(1.4),zfit:()=>{V=null;dibuja()},
arOn:()=>{const DO=window.DeviceOrientationEvent,pO=DO?.requestPermission?DO.requestPermission().catch(()=>'no'):Promise.resolve(DO?'granted':'no'),pC=navigator.mediaDevices?.getUserMedia?navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).catch(()=>null):Promise.resolve(null);
 Promise.all([pO,pC]).then(async([o,st])=>{const v=$('#cam');if(o==='granted'){addEventListener('deviceorientationabsolute',onOri);addEventListener('deviceorientation',onOri)}
  if(st&&v&&S.view==='camara'){S.stream=st;v.srcObject=st;try{await v.play()}catch(e){}$('#ar').classList.add('cam-on')}else if(st)st.getTracks().forEach(t=>t.stop());
  arHud();setTimeout(()=>{if(S.view!=='camara')return;if(!S.stream&&!S.compOK)toast('Aquí no hay acceso a cámara ni brújula. Sigue en simulación o abre la app publicada desde tu celular.');else if(!S.stream)toast('Sin permiso de cámara. La flecha funciona igual.');else if(!S.compOK)toast('Este equipo no tiene brújula: arrastra para girar.');arHud()},1500)})},
arNext:()=>{if(!R?.ids[1])return;S.modo='manual';S.origen=R.ids[1];store.set('.p',{o:S.origen,a:S.acc});calc();if(R&&R.ids.length<2)toast('Llegaste a '+PT[S.destino].nombre);else if(!S.compOK&&R?.ids[1])S.heading=(brg(yo(),PT[R.ids[1]])+332)%360;render()},
calGps:()=>{if(!navigator.geolocation)return toast('Este dispositivo no entrega ubicación.');toast('Leyendo GPS…');navigator.geolocation.getCurrentPosition(p=>{const i=$('#calLL');if(i){i.value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);toast('Coordenadas leídas (±'+Math.round(p.coords.accuracy)+' m). Revisa y guarda.')}},()=>toast('No se pudo leer el GPS. Pega las coordenadas desde Google Maps.'),{enableHighAccuracy:true,timeout:15000})},
evDel:b=>{D.eventos=D.eventos.filter(e=>e.id!==b.dataset.id);S.adm='ev';guarda();toast('Evento quitado.')},
qr:b=>copia(location.href.split('#')[0]+'#desde-'+b.dataset.id,'Enlace copiado.'),
jsonCopy:()=>{const{centro,radio,...d}=D,t=JSON.stringify(d,null,1);$('#json').value=t;copia(t,'Datos copiados.')},
jsonLoad:()=>{let d;try{d=JSON.parse($('#json').value)}catch(e){return toast('El texto no es un JSON válido. Revisa comas y llaves.')}if(!valido(d))return toast('Faltan puntos, caminos o eventos en los datos.');D=d;S.adm='json';guarda();toast('Datos cargados.')},
reset:()=>{store.del('.d');D=ejemplo();S.destino=null;index();render(true);toast('Datos de ejemplo restaurados.')},
noDemo:()=>{D.ejemplo=false;S.adm='json';guarda()}};

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){A[b.dataset.act]?.(b);return}if(e.target.id==='scrim')cierra()});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='selO')origen(t.value,'manual');else if(t.id==='selD'){S.destino=t.value||null;calc();render(true)}else if(t.id==='acc'){S.acc=t.checked;store.set('.p',{o:S.origen,a:S.acc});calc();render(true)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.id;
 if(f==='fCal'){const m=$('#calLL').value.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*$/),p=PT[$('#calP').value];if(!m||Math.abs(m[1])>90||Math.abs(m[2])>180)return toast('Escribe latitud y longitud separadas por coma, por ejemplo -16.5229, -68.1121');p.lat=+m[1];p.lng=+m[2];S.adm='cal';const id=p.id;guarda();$('#calP').value=id;toast('Guardado: '+p.nombre+'. Las distancias se recalcularon.')}
 if(f==='fEv'){const i=new Date($('#evI').value),fi=new Date($('#evF').value);if(isNaN(i)||isNaN(fi)||fi<=i)return toast('La hora de término debe ser posterior a la de inicio.');D.eventos.push({id:'e'+Date.now().toString(36),nombre:$('#evN').value.trim(),punto:$('#evP').value,inicio:i.toISOString(),fin:fi.toISOString(),desc:$('#evD').value.trim()});S.adm='ev';guarda();toast('Evento agregado.')}});
document.addEventListener('toggle',e=>{if(e.target.open&&e.target.dataset?.k)S.adm=e.target.dataset.k},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')cierra();if(S.view==='camara'&&!S.compOK&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){S.heading=(S.heading+(e.key==='ArrowLeft'?-8:8)+360)%360;S.arDirty=true}});
addEventListener('hashchange',ruteo);
addEventListener('resize',()=>{if(S.view==='mapa'){V=null;dibuja()}});
setInterval(()=>{if(S.view==='eventos'&&$('#sheet').hidden)render();else if(S.view==='mapa')dibuja()},30000);

const g=store.get('.d'),pf=store.get('.p');D=valido(g)?g:ejemplo();if(pf){S.origen=pf.o;S.acc=!!pf.a}index();ruteo();
if(!valido(g))fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(valido(d)){D=d;index();render(true)}}).catch(()=>{});
})();
</script>
